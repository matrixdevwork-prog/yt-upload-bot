name: Daily YouTube Upload Bot

on:
  schedule:
    # 12:00 PM IST run → 2:00 PM publish
    - cron: '30 6 * * *'
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automation bot
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}

          # 🔥 NEW multi folder env
          PENDING_FOLDER_ID_0: ${{ secrets.PENDING_FOLDER_ID_0 }}
          PENDING_FOLDER_ID_1: ${{ secrets.PENDING_FOLDER_ID_1 }}

          UPLOADED_FOLDER_ID: ${{ secrets.UPLOADED_FOLDER_ID }}
        run: |
          echo "🚀 Starting YouTube automation bot..."
          python main.py

      - name: Commit updated titles.txt
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add titles.txt
          git commit -m "chore: mark title as used" || echo "No changes"
          git push
