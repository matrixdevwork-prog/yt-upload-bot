name: Daily YouTube Upload Bot

on:
  schedule:
    # 12:00 PM IST run (6:30 AM UTC)
    - cron: '30 6 * * *'
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # 2️⃣ Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4️⃣ Run bot
      - name: Run YouTube automation bot
        env:
          DRIVE_TOKEN_JSON_A: ${{ secrets.DRIVE_TOKEN_JSON_A }}
          YOUTUBE_TOKEN_JSON_B: ${{ secrets.YOUTUBE_TOKEN_JSON_B }}
          PENDING_FOLDER_ID: ${{ secrets.PENDING_FOLDER_ID }}
          UPLOADED_FOLDER_ID: ${{ secrets.UPLOADED_FOLDER_ID }}
        run: |
          echo "🚀 Starting bot..."
          python main.py

      # 5️⃣ Commit updated titles.txt
      - name: Commit updated titles.txt
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add titles.txt
          git commit -m "chore: mark title as used" || echo "No changes"
          git push
